name: UI Tests

on:
  workflow_dispatch:
  pull_request:

jobs:
  ui-test:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: brew install xcodegen xcbeautify

      - name: Generate Xcode Project
        run: xcodegen

      - name: Run UI Tests
        run: |
          xcodebuild test \
            -scheme TestApp \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -resultBundlePath ./TestApp.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" | xcbeautify

      - name: Export Screenshots from Result Bundle
        run: |
          mkdir -p screenshots
          xcrun xcresulttool export attachments \
            --path ./TestApp.xcresult \
            --output-path ./screenshots

      - name: Upload Screenshot Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: screenshots/