# ==============================================================================
# GITHUB SECRETS REQUIREMENT DOCUMENTATION
# ==============================================================================
# Before running a "Signed" build, you must configure the following repository 
# secrets under Settings > Secrets and variables > Actions:
#
# 1. BUILD_CERTIFICATE_BASE64
#    - What: Your Apple Distribution .p12 certificate file converted to Base64.
#    - How to generate: base64 -w 0 certificates.p12
#
# 2. P12_PASSWORD
#    - What: The plain-text password you created when exporting the .p12 file.
#
# 3. BUILD_PROVISIONING_PROFILE_BASE64
#    - What: Your .mobileprovision file downloaded from Apple, converted to Base64.
#    - How to generate: base64 -w 0 profile.mobileprovision
#
# 4. DEVELOPMENT_TEAM
#    - What: Your 10-character Apple Developer Team ID (e.g., A1B2C3D4E5).
#    - How to find: Visible in the top right corner of the Apple Developer Portal.
#
# 5. CODE_SIGN_IDENTITY
#    - What: The full text name of your certificate.
#    - Example: "Apple Distribution: Your Company Name LLC (A1B2C3D4E5)"
#
# 6. PROVISIONING_PROFILE_SPECIFIER
#    - What: The explicit Name or the UUID string of your provisioning profile.
#    - Example: "My_App_AppStore_Profile" or "XXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXX"
# ==============================================================================

name: Build iOS App

on:
  workflow_dispatch:
    inputs:
      sign_build:
        description: 'Sign the build?'
        required: true
        type: boolean
        default: false

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools 
        run: brew install xcodegen xcbeautify

      - name: Generate Xcode Project
        run: xcodegen 

      - name: Install Apple Certificate and Provisioning Profile
        if: ${{ inputs:sign_build == true }}
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISIONING_PROFILE_BASE64: ${{ secrets.BUILD_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: "temporary_ci_password"
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/profile.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # Decode base64 strings back into raw binary files
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISIONING_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          # Setup isolated temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import signing identities
          security import $CERTIFICATE_PATH -k $KEYCHAIN_PATH -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"')

          # Register profile with Xcode system path
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build Unsigned Archive
        if: ${{ inputs:sign_build == false }}
        run: |
          xcodebuild archive \
            -project TestApp.xcodeproj \
            -scheme TestApp \
            -sdk iphoneos \
            -archivePath ./build/TestApp.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" | xcbeautify

      - name: Build Signed Archive
        if: ${{ inputs:sign_build == true }}
        env:
          DEV_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          SIGN_ID: ${{ secrets.CODE_SIGN_IDENTITY }}
          PROV_SPEC: ${{ secrets.PROVISIONING_PROFILE_SPECIFIER }}
        run: |
          xcodebuild archive \
            -project TestApp.xcodeproj \
            -scheme TestApp \
            -sdk iphoneos \
            -archivePath ./build/TestApp.xcarchive \
            DEVELOPMENT_TEAM="$DEV_TEAM" \
            CODE_SIGN_IDENTITY="$SIGN_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROV_SPEC" | xcbeautify

      - name: Upload xcarchive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TestApp-Archive
          path: ./build/TestApp.xcarchive
