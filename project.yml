name: TestApp
targets:
  TestApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources: [Sources]
    settings:
      CODE_SIGN_STYLE: Manual
      PRODUCT_BUNDLE_IDENTIFIER: com.example.app
    info:
      path: TestApp.xcodeproj/Info.plist
      properties:
        UILaunchScreen: {}
  TestAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: TestApp 
